<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Formation — Login</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>

<button class="theme-btn" id="themeBtn">🌙</button>

<div class="page-wrap">
  <div class="card">
    <div class="eyebrow">CEEL301 · Graphics Design</div>
    <h1>Group Formation</h1>
    <p class="sub">Sign in with your school email and student number to continue.</p>

    <a href="how-it-works.html" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);text-decoration:none;margin-bottom:20px;">&#128203; How does this work? &rarr;</a>

    <div class="alert alert-err" id="errMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">School Email</label>
        <input type="email" id="email" placeholder="you@school.edu" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="studentNo">Student Number (password)</label>
        <input type="password" id="studentNo" placeholder="e.g. 2024-00001" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
        Sign In
      </button>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script>
  /* redirect if already logged in */
  if (localStorage.getItem('gf_token')) location.replace('dashboard.html');

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('errMsg');
    errEl.className = 'alert alert-err';

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const res = await api('/api/login', 'POST', {
        email: document.getElementById('email').value.trim(),
        student_no: document.getElementById('studentNo').value.trim(),
      });
      localStorage.setItem('gf_token', res.token);
      localStorage.setItem('gf_student', JSON.stringify(res.student));
      location.replace('dashboard.html');
    } catch (ex) {
      errEl.textContent = ex.message || 'Login failed. Check your credentials.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
