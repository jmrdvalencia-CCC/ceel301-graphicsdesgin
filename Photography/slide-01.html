<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Slide 1 / 30 — Title — Photography & Editing</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0d0d0d;--paper:#faf8f4;
  --amber:#e8a020;--amber2:#f5c050;
  --rose:#e05c6f;--teal:#2ec4b6;--violet:#7c5cbf;--blue:#3a86ff;
  --muted:#6b6560;--border:#d4cfc5;
  --panel:#1a1714;
  --mono:'Space Mono',monospace;
  --serif:'Playfair Display',serif;
  --sans:'Inter',sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:var(--sans)}
#deck{width:100vw;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 48px 80px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;transform:translateX(60px);overflow:hidden}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}
.slide>*{position:relative;z-index:1}
.bg-ink{background:var(--ink)}
.bg-dark{background:#0a0a10}
.bg-amber{background:linear-gradient(135deg,#1a1000,#2a1a00,#1a1000)}
.bg-rose{background:linear-gradient(135deg,#1a0810,#2a0d18,#1a0810)}
.bg-teal{background:linear-gradient(135deg,#081a18,#0d2a26,#081a18)}
.bg-violet{background:linear-gradient(135deg,#100a1a,#1a1028,#100a1a)}
.bg-blue{background:linear-gradient(135deg,#080f1a,#0d1828,#080f1a)}
.bg-split{background:linear-gradient(160deg,#0d0d18 55%,#1a1200 55%)}
#pbar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--amber),var(--rose),var(--teal));transition:width .4s;z-index:200;border-radius:0 2px 2px 0}
#ctr{position:fixed;top:14px;right:18px;font-family:var(--mono);font-size:.65rem;color:rgba(255,255,255,.35);z-index:200;letter-spacing:.1em}
#dots{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:200;flex-wrap:wrap;justify-content:center;max-width:90vw}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;border:none;transition:all .3s}
.dot.active{background:var(--amber);width:18px;border-radius:3px}
.nbtn{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.06);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);width:40px;height:40px;border-radius:50%;font-size:1rem;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;transition:all .2s;text-decoration:none}
.nbtn:hover{background:rgba(255,255,255,.14);color:#fff}
#bp{left:12px}#bn{right:12px}
.eyebrow{font-family:var(--mono);font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.eyebrow .ln{flex:0 0 24px;height:1px;background:var(--amber);opacity:.5}
.ttl{font-family:var(--serif);font-size:clamp(2rem,5vw,4rem);font-weight:900;line-height:1.05;color:#fff;margin-bottom:12px}
.ttl .acc{color:var(--amber)}
.sub{font-size:clamp(.85rem,1.6vw,1.05rem);color:rgba(255,255,255,.65);line-height:1.7;max-width:680px}
.sub strong{color:var(--amber)}
.label{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.label.rose{color:var(--rose)}.label.teal{color:var(--teal)}.label.violet{color:var(--violet)}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%;max-width:1000px;margin-top:10px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 18px;flex:1;min-width:170px;max-width:240px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--amber)}
.ci{font-size:1.6rem;margin-bottom:6px}
.ct{font-size:.82rem;font-weight:700;color:#fff;margin-bottom:4px}
.cb{font-size:.72rem;color:rgba(255,255,255,.6);line-height:1.5}
.tbl{width:100%;max-width:900px;border-collapse:collapse;font-size:.72rem}
.tbl th{background:rgba(232,160,32,.12);color:var(--amber);font-weight:700;padding:9px 12px;text-align:left;border-bottom:1px solid rgba(232,160,32,.25);font-family:var(--mono);letter-spacing:.06em;font-size:.62rem;text-transform:uppercase}
.tbl td{padding:8px 12px;color:rgba(255,255,255,.8);border-bottom:1px solid rgba(255,255,255,.06)}
.tbl tr:hover td{background:rgba(255,255,255,.04)}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:.72rem;font-weight:600;padding:6px 14px;border-radius:20px;font-family:var(--mono);letter-spacing:.05em}
.pill.amber{background:rgba(232,160,32,.15);border-color:rgba(232,160,32,.4);color:var(--amber2)}
.pill.rose{background:rgba(224,92,111,.15);border-color:rgba(224,92,111,.4);color:#f08090}
.pill.teal{background:rgba(46,196,182,.15);border-color:rgba(46,196,182,.4);color:#5de0d8}
.pill.violet{background:rgba(124,92,191,.15);border-color:rgba(124,92,191,.4);color:#a88de0}
.pill.blue{background:rgba(58,134,255,.15);border-color:rgba(58,134,255,.4);color:#7ab0ff}
.ladder{display:flex;flex-direction:column;gap:8px;width:100%;max-width:680px}
.rung{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:10px;padding:10px 16px;border-left:3px solid var(--amber)}
.rung.rose{border-left-color:var(--rose)}.rung.teal{border-left-color:var(--teal)}.rung.violet{border-left-color:var(--violet)}.rung.blue{border-left-color:var(--blue)}
.rn{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--amber);min-width:28px}
.rn.rose{color:var(--rose)}.rn.teal{color:var(--teal)}.rn.violet{color:var(--violet)}.rn.blue{color:var(--blue)}
.rt{text-align:left}
.rtitle{font-size:.85rem;font-weight:700;color:#fff}
.rdesc{font-size:.68rem;color:rgba(255,255,255,.55)}
.kbox{background:rgba(232,160,32,.1);border:1px solid rgba(232,160,32,.3);border-radius:12px;padding:14px 18px;max-width:700px;font-size:.8rem;color:rgba(255,255,255,.75);line-height:1.6}
.kbox.rose{background:rgba(224,92,111,.1);border-color:rgba(224,92,111,.3)}
.kbox.teal{background:rgba(46,196,182,.1);border-color:rgba(46,196,182,.3)}
.stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.sbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px 22px;min-width:130px;text-align:center}
.snum{font-family:var(--serif);font-size:2.4rem;font-weight:900;color:var(--amber);line-height:1}
.slbl{font-size:.65rem;color:rgba(255,255,255,.5);margin-top:4px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.img-slot{border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.65rem;color:rgba(255,255,255,.3);letter-spacing:.08em;text-align:center;padding:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:900px;align-items:start}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;width:100%;max-width:960px;align-items:start}
.act-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 18px;flex:1;min-width:200px;max-width:300px}
.act-num{font-family:var(--serif);font-size:2rem;font-weight:900;color:var(--amber);line-height:1;margin-bottom:6px}
.act-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:6px}
.act-body{font-size:.7rem;color:rgba(255,255,255,.55);line-height:1.5}
.rubric{width:100%;max-width:700px;border-collapse:collapse;font-size:.72rem}
.rubric th{background:rgba(232,160,32,.15);color:var(--amber);font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;text-align:left;border-bottom:1px solid rgba(232,160,32,.3)}
.rubric td{padding:7px 12px;color:rgba(255,255,255,.8);border-bottom:1px solid rgba(255,255,255,.06)}
.rubric .pts{color:var(--amber);font-weight:700;font-family:var(--mono);text-align:right}
.rubric .total td{color:var(--amber);font-weight:700;border-top:1px solid rgba(232,160,32,.4)}
.slide.active .eyebrow{animation:su .5s .05s both}
.slide.active .ttl{animation:su .5s .15s both}
.slide.active .sub{animation:su .5s .25s both}
.slide.active .cards .card:nth-child(1){animation:su .4s .15s both}
.slide.active .cards .card:nth-child(2){animation:su .4s .25s both}
.slide.active .cards .card:nth-child(3){animation:su .4s .35s both}
.slide.active .cards .card:nth-child(4){animation:su .4s .45s both}
.slide.active .rung:nth-child(1){animation:su .4s .15s both}
.slide.active .rung:nth-child(2){animation:su .4s .25s both}
.slide.active .rung:nth-child(3){animation:su .4s .35s both}
.slide.active .rung:nth-child(4){animation:su .4s .45s both}
.slide.active .rung:nth-child(5){animation:su .4s .5s both}
.slide.active .rung:nth-child(6){animation:su .4s .55s both}
.slide.active .sbox:nth-child(1){animation:bi .5s .15s both}
.slide.active .sbox:nth-child(2){animation:bi .5s .28s both}
.slide.active .sbox:nth-child(3){animation:bi .5s .41s both}
.slide.active .tbl{animation:su .5s .2s both}
.slide.active .rubric{animation:su .5s .2s both}
@keyframes su{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes bi{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
#sbtn{position:fixed;bottom:50px;right:12px;background:var(--rose);color:#fff;border:none;border-radius:50px;padding:8px 14px;font-size:.68rem;font-weight:700;cursor:pointer;z-index:200;display:flex;align-items:center;gap:5px;box-shadow:0 4px 16px rgba(224,92,111,.4);transition:transform .2s;font-family:var(--mono);letter-spacing:.06em}
#sbtn:hover{transform:scale(1.05)}
#toast{position:fixed;bottom:100px;right:12px;background:var(--panel);color:#fff;padding:8px 14px;border-radius:8px;font-size:.68rem;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid rgba(255,255,255,.1);font-family:var(--mono)}
#toast.show{opacity:1}
@media(max-width:600px){.slide{padding:48px 18px 72px}.ttl{font-size:1.8rem}.cards{gap:8px}.card{min-width:140px;padding:12px}.tbl{font-size:.62rem}.tbl th,.tbl td{padding:6px 8px}.two-col,.three-col{grid-template-columns:1fr}}
html,body{width:100%;height:100%;overflow:hidden}
.slide{opacity:1;pointer-events:all;transform:none;position:absolute;inset:0}
#pbar{width:3.3%}
</style>
</head>
<body>
<div id="deck">
<div id="pbar"></div>
<div id="ctr">1 / 30</div>

<section class="slide bg-dark active" id="s1">
<div style="text-align:center">
  <div style="font-family:var(--mono);font-size:.65rem;letter-spacing:.3em;color:rgba(232,160,32,.5);margin-bottom:18px;text-transform:uppercase">Module 07 &nbsp;·&nbsp; Graphics Design · 26–27 1st Sem</div>
  <div style="font-family:var(--serif);font-size:clamp(2.8rem,7vw,5.5rem);font-weight:900;line-height:.95;color:#fff;margin-bottom:4px">Photography</div>
  <div style="font-family:var(--serif);font-size:clamp(2.8rem,7vw,5.5rem);font-weight:900;line-height:.95;color:var(--amber);font-style:italic;margin-bottom:22px">&amp; Editing</div>
  <div style="font-family:var(--mono);font-size:clamp(.7rem,1.3vw,.85rem);color:rgba(255,255,255,.4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:28px">Composition &nbsp;·&nbsp; Lighting &nbsp;·&nbsp; Photo Editing</div>
  <div class="pills" style="justify-content:center">
    <span class="pill amber">📐 Composition</span>
    <span class="pill rose">💡 Lighting</span>
    <span class="pill teal">🎛 Exposure</span>
    <span class="pill violet">✨ Editing</span>
  </div>
  <div style="margin-top:24px;font-family:var(--mono);font-size:.6rem;color:rgba(255,255,255,.2);letter-spacing:.1em">Mrantinkovic et al. (2020) — 3G Handy Guide: Graphic Designing</div>
</div>
</section>

<a class="nbtn" id="bn" href="slide-02.html"><i class="fas fa-chevron-right"></i></a>
<div id="dots">
<button class="dot active" onclick="location='slide-01.html'"></button><button class="dot" onclick="location='slide-02.html'"></button><button class="dot" onclick="location='slide-03.html'"></button><button class="dot" onclick="location='slide-04.html'"></button><button class="dot" onclick="location='slide-05.html'"></button><button class="dot" onclick="location='slide-06.html'"></button><button class="dot" onclick="location='slide-07.html'"></button><button class="dot" onclick="location='slide-08.html'"></button><button class="dot" onclick="location='slide-09.html'"></button><button class="dot" onclick="location='slide-10.html'"></button><button class="dot" onclick="location='slide-11.html'"></button><button class="dot" onclick="location='slide-12.html'"></button><button class="dot" onclick="location='slide-13.html'"></button><button class="dot" onclick="location='slide-14.html'"></button><button class="dot" onclick="location='slide-15.html'"></button><button class="dot" onclick="location='slide-16.html'"></button><button class="dot" onclick="location='slide-17.html'"></button><button class="dot" onclick="location='slide-18.html'"></button><button class="dot" onclick="location='slide-19.html'"></button><button class="dot" onclick="location='slide-20.html'"></button><button class="dot" onclick="location='slide-21.html'"></button><button class="dot" onclick="location='slide-22.html'"></button><button class="dot" onclick="location='slide-23.html'"></button><button class="dot" onclick="location='slide-24.html'"></button><button class="dot" onclick="location='slide-25.html'"></button><button class="dot" onclick="location='slide-26.html'"></button><button class="dot" onclick="location='slide-27.html'"></button><button class="dot" onclick="location='slide-28.html'"></button><button class="dot" onclick="location='slide-29.html'"></button><button class="dot" onclick="location='slide-30.html'"></button>
</div>
<button id="sbtn" onclick="share()"><i class="fas fa-share-alt"></i> Share</button>
<div id="toast">📋 Link copied!</div>
</div>
<script>
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown') location='slide-02.html';
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') location='index.html';
});
var sx=0;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)location=dx<0?'slide-02.html':'index.html';});
function share(){var u=location.href;if(navigator.share){navigator.share({title:'Photography & Editing',url:u}).catch(function(){});}else{navigator.clipboard.writeText(u).then(function(){var t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);});}}
</script>
</body>
</html>
